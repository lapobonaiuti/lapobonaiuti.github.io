---
layout: default
title: Il mio Archivio
---

<section class="archivio">
  {% for post in site.posts %}
    <article>
        <p><small>{{ post.date | date: "%d/%m/%Y" }} - Categoria: {{ post.categories | first }}</small></p>
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <p>{{ post.excerpt }}</p>
        <hr>
    </article>
  {% endfor %}
</section>
